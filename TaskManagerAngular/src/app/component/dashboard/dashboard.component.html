<div class="task-container container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-0">Task Dashboard</h2>
      <h5 class="welcome-text">Welcome, {{ userName }}</h5>
    </div>

    <button class="btn btn-outline-secondary" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>

  <!-- Feedback Message -->
  <div *ngIf="message" class="alert custom-alert">{{ message }}</div>
  <div *ngIf="tasks.length > 0; else noTasks" class="task-grid">
    <div *ngFor="let task of tasks" class="task-card shadow-sm">

      <!-- TITLE & PRIORITY -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="task-title">{{ task.title }}</h5>
        <span class="priority-badge" [ngClass]="task.priority.toLowerCase()">
          {{ task.priority }}
        </span>
      </div>

      <!-- DESCRIPTION -->
      <p class="task-desc text-muted">{{ task.description }}</p>

      <!-- META -->
      <div class="task-meta">
        <div><strong>Status:</strong> {{ task.status }}</div>
        <div><strong>Due:</strong> {{ task.dueDate | date:'mediumDate' }}</div>
        <div><strong>Created:</strong> {{ task.createdAt | date:'mediumDate' }}</div>
      </div>

      <!-- ACTIONS -->
      <div class="task-actions">
        <button class="btn btn-sm btn-outline-warning" (click)="editTask(task)">
          <i class="bi bi-pencil-fill"></i> Edit
        </button>

        <button class="btn btn-sm btn-outline-danger" (click)="deleteTask(task.taskId)">
          <i class="bi bi-trash-fill"></i> Delete
        </button>
      </div>

    </div>
  </div>


  <ng-template #noTasks>
    <p class="text-muted text-center mt-5">No tasks found.</p>
  </ng-template>
</div>

<!-- Floating Add Button -->
<button class="btn btn-primary fab" (click)="openAddTaskModal()">
  <i class="bi bi-plus-lg"></i>
</button>

<!-- ADD Task Modal -->
<div class="modal fade" #addTaskModal tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Add Task</h5>
        <button type="button" class="btn-close" (click)="closeAddTaskModal()"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="addTask()">

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" [(ngModel)]="newTask.title" name="title" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="newTask.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="newTask.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="newTask.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="newTask.dueDate" name="dueDate">
          </div>

          <button class="btn btn-primary w-100" type="submit">Add Task</button>

        </form>
      </div>

    </div>
  </div>
</div>

<!-- EDIT Task Modal -->
<div class="modal fade" #editTaskModal tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Task</h5>
        <button type="button" class="btn-close" (click)="closeEditTaskModal()"></button>
      </div>

      <div class="modal-body">

        <form (ngSubmit)="updateTask()">

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" [(ngModel)]="editTaskData.title" name="title" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="editTaskData.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="editTaskData.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="editTaskData.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="editTaskData.dueDate" name="dueDate">
          </div>

          <button class="btn btn-primary w-100" type="submit">Update Task</button>

        </form>
      </div>

    </div>
  </div>
</div>
