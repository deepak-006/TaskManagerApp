<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-0">Task Dashboard</h2>
      <h5 class="text-primary">Welcome, {{ userName }}</h5>
    </div>

    <button class="btn btn-outline-secondary" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>


  <div *ngIf="message" class="alert alert-warning">{{ message }}</div>

  <!-- Task Cards -->
  <div *ngIf="tasks.length > 0; else noTasks">
    <div *ngFor="let task of tasks" class="card mb-4 shadow-sm fb-post-style">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="card-title mb-0">{{ task.title }}</h5>
          <span class="badge bg-primary">{{ task.priority }}</span>
        </div>

        <p class="card-text text-muted">{{ task.description }}</p>

        <div class="d-flex justify-content-between align-items-center mt-2 border-top pt-2 small text-secondary">
          <div><strong>Status:</strong> {{ task.status }}</div>
          <div><strong>Due:</strong> {{ task.dueDate | date: 'mediumDate' }}</div>
          <div><strong>Created:</strong> {{ task.createdAt | date: 'mediumDate' }}</div>
        </div>

        <div class="mt-3 d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-warning" (click)="editTask(task)">
            <i class="bi bi-pencil-fill"></i> Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteTask(task.taskId)">
            <i class="bi bi-trash-fill"></i> Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noTasks>
    <p class="text-muted text-center mt-5">No tasks found.</p>
  </ng-template>
</div>

<!-- Floating Action Button -->
<button class="btn btn-primary fab" (click)="openAddTaskModal()">
  <i class="bi bi-plus-lg"></i>
</button>

<!-- Add Task Modal -->
<!-- Add Task Modal -->
<div class="modal fade" #addTaskModal tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
        <button type="button" class="btn-close" (click)="closeAddTaskModal()"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="addTask()">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" [(ngModel)]="newTask.title" name="title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="newTask.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="newTask.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="newTask.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="newTask.dueDate" name="dueDate">
          </div>

          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Edit Task Modal -->
<div class="modal fade" #editTaskModal tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editTaskModalLabel">Edit Task</h5>
        <button type="button" class="btn-close" (click)="closeEditTaskModal()"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="updateTask()">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" [(ngModel)]="editTaskData.title" name="title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="editTaskData.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="editTaskData.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="editTaskData.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="editTaskData.dueDate" name="dueDate">
          </div>

          <button type="submit" class="btn btn-primary">Update Task</button>
        </form>
      </div>
    </div>
  </div>
</div>
