<div class="dashboard-container">

  <!-- SEARCH BAR -->
  <div class="search-container">
    <div class="search-wrapper">
      <i class="bi bi-search"></i>

      <input type="text"
             class="search-input"
             placeholder="Search tasks..."
             [(ngModel)]="searchText"
             (input)="filterTasks()">

      <!-- CLEAR BUTTON -->
      <button *ngIf="searchText" class="clear-btn" (click)="clearSearch()">✕</button>
    </div>
  </div>


 
  <!-- TASK GRID -->
  <!-- If search is empty → Show quick links only -->
  <div *ngIf="!searchText || searchText.trim().length === 0" class="quick-links">
    <div class="quick-link" (click)="goToBoard()">
      <img src="assets/board.png" alt="Board">
      <span>Board</span>
    </div>

    <div class="quick-link" (click)="goToCalendar()">
      <img src="assets/calendar.png" alt="Calendar">
      <span>Calendar</span>
    </div>

    <div class="quick-link" (click)="goToAnalytics()">
      <img src="assets/analytics.png" alt="Analytics">
      <span>Analytics</span>
    </div>

    <div class="quick-link" (click)="goToRecycleBin()">
      <img src="assets/bin.png" alt="Recycle Bin">
      <span>Recycle Bin</span>
    </div>

    <div class="quick-link" (click)="openAddTaskModal()">
      <img src="assets/add.png" alt="Add Task">
      <span>New Task</span>
    </div>
  </div>


  <!-- If search has text → Show filtered tasks -->
  <div *ngIf="searchText && searchText.trim().length > 0">

    <!-- No tasks found -->
    <div *ngIf="filteredTasks.length === 0" class="text-center mt-5 text-muted">
      No matching tasks.
    </div>

    <!-- Tasks Grid -->
    <div *ngIf="filteredTasks.length > 0" class="task-grid">
      <app-task-card *ngFor="let task of filteredTasks"
                     [task]="task"
                     (edit)="openEditModal($event)"
                     (delete)="deleteTask($event)">
      </app-task-card>
    </div>

  </div>


</div>



<!-- ADD TASK MODAL -->
<div class="modal fade" #addTaskModal tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Add Task</h5>
        <button type="button" class="btn-close" (click)="closeAddTaskModal()"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="addTask()">

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" [(ngModel)]="newTask.title" name="title" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="newTask.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="newTask.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="newTask.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="newTask.dueDate" name="dueDate" />
          </div>

          <button class="btn btn-primary w-100" type="submit">Add Task</button>

        </form>
      </div>

    </div>
  </div>
</div>


<!-- EDIT TASK MODAL -->
<div class="modal fade" #editTaskModal tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Task</h5>
        <button type="button" class="btn-close" (click)="closeEditTaskModal()"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="updateTask()">

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" [(ngModel)]="editTaskData.title" name="title" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="editTaskData.description" name="description"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="editTaskData.priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="editTaskData.status" name="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="editTaskData.dueDate" name="dueDate" />
          </div>

          <button class="btn btn-primary w-100" type="submit">Update Task</button>

        </form>
      </div>

    </div>
  </div>
</div>
