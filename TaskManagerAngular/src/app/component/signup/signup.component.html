<div class="signup-container">
  <div class="signup-card">

    <h2 class="signup-title">Create Account</h2>
    <p class="signup-subtitle">Join us and get started</p>

    <form (ngSubmit)="onSignup()">

      <!-- Two Column Layout -->
      <div class="row">
        <div class="col">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" [(ngModel)]="firstName" name="firstName" required />
          </div>
        </div>

        <div class="col">
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="lastName" name="lastName" required />
          </div>
        </div>
      </div>

      <!-- DOB & Email -->
      <div class="row">
        <div class="col">
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" [(ngModel)]="dateOfBirth" name="dateOfBirth" required />
          </div>
        </div>

        <div class="col">
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" name="email" required />
          </div>
        </div>
      </div>

      <!-- Password (full row) -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required />
      </div>

      <!-- Role Checkbox -->
      <div class="form-group role-checkbox">
        <input type="checkbox" [(ngModel)]="isAdmin" name="isAdmin" />
        <span>Sign up as Admin?</span>
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>

      <!-- Login Redirect -->
      <p class="login-redirect">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </form>

    <p class="signup-message" *ngIf="message">{{ message }}</p>

  </div>
</div>
